version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-dev:
        dependency-type: development
  - package-ecosystem: pip
    directory: /mock-erp
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/test", "jsdom"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "prettier*"]
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      # react-pdf@11 needs React 19.
      - dependency-name: react-pdf
        update-types: ["version-update:semver-major"]
      # openapi-typescript's peer range stops at TypeScript 5.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a config/CSS rewrite; migrate deliberately.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # @vitest/mocker peers on msw@^2, so a lone msw major leaves an unsatisfiable lockfile.
      - dependency-name: msw
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
