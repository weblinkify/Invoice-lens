[project]
name = "invoicelens-backend"
version = "0.1.0"
description = "InvoiceLens — AI invoice data extraction API"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "openpyxl>=3.1",
    "anthropic>=1.13.0",
    "openai>=3.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "faker>=28.0",
    "reportlab>=4.2",
    "types-openpyxl",
    "types-reportlab",
]

[tool.uv]
package = false
# cryptography>=49 ships no Intel-macOS wheels; keep local dev on those machines working.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]
ignore = ["S101", "S311", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.testclient"]
markers = ["integration: full API flow tests", "accuracy: extraction accuracy over fixtures"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
